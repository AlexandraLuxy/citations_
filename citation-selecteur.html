<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>


	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Ranchers&display=swap" rel="stylesheet">



	<style>
		body{ font-family: "Ranchers", sans-serif;}
		div {color: powderblue;}
		.quote{font-size: 2rem;}
		.source{
			font-family: Georgia, 'Times New Roman', Times, serif;
			margin-top: 1rem;
		}

		.citation{
			margin: 2rem;
			border: 1px solid black;
			padding: 1rem;
			border-radius: 1rem;
			aspect-ratio: 1.4/1;
			
		}

		.important{ background:black }

		#pepito{ background: purple; }

		#pickle{background: purple; }
		.important{background: black;}

		body{
			background-color: black;
		}


	</style>

</head>
<body>

	<div class="citation" id= "pepito">
		<div class="quote">"Nous faisons tous des choix dans la vie, mais ce sont nos choix qui nous font.“</div>	
		<div class="source important">-Bioshock</div>

	</div>

	<div class="citation" id="pickle">
		<div class="quote">"Requiescat in pace “</div>
		<div class="source important">-Ezio Auditore</div>
	</div>




	
</body>
</html>
